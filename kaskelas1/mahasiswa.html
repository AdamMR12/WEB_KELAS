<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Daftar mahasiswa Kas Kelas SI 2A - Politeknik Negeri Subang"
  >

  <meta
    name="theme-color"
    content="#5B3DF0"
  >

  <title>Daftar Mahasiswa | Kas Kelas SI 2A</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS utama -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Tambahan khusus halaman daftar mahasiswa */
    .mhead{padding:32px 0 8px}
    .mhead p.hint{margin-bottom:8px}
    .mhead h1{font-size:clamp(1.9rem,5vw,2.8rem)}
    .mhead .lead{margin-top:10px;color:var(--muted);max-width:52ch}
    .mtoolbar{margin:22px 0 18px}
    .mcount{margin-top:10px;color:var(--muted);font-weight:600;font-size:.95rem}
    .mlist{list-style:none;margin:0 0 40px;padding:0;display:grid;gap:10px}
    .mrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:14px;border:2px solid var(--rule);border-radius:16px;background:var(--surface)}
    .mrow .idx{flex:none;min-width:52px;color:var(--muted);font-weight:700;font-size:.85rem}
    .mrow .rn{flex:1 1 160px}
    .copyBtn{flex:none;min-height:40px;padding:0 14px;font-size:.92rem}
    .copyBtn svg{width:16px;height:16px}
    .copyBtn.done{background:var(--in-bg);color:var(--in-ink);border-color:var(--in-ink)}
  </style>
</head>

<body>

  <a
    href="#main"
    class="skip"
  >
    Lewati ke konten utama
  </a>


  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header class="top">

    <div class="wrap hbar">

      <a
        href="index.html"
        class="brand"
        aria-label="Kembali ke dashboard Kas Kelas SI 2A"
      >

        <span
          class="mark"
          aria-hidden="true"
        >
          K
        </span>

        <span>
          Kelas SI 2A
        </span>

      </a>


      <nav
        class="nav"
        aria-label="Navigasi utama"
      >

        <a href="index.html#dashboard">
          Dashboard
        </a>

        <a href="index.html#cek-iuran">
          Cek iuran
        </a>

        <a href="index.html#riwayat">
          Riwayat kas
        </a>

        <a href="mahasiswa.html" aria-current="page">
          Mahasiswa
        </a>

      </nav>

    </div>

  </header>


  <!-- =========================================================
       MAIN
       ========================================================= -->

  <main
    id="main"
    class="wrap"
  >

    <section class="mhead" aria-labelledby="mahasiswa-title">

      <p class="hint" style="margin-bottom:8px;">
        DAFTAR MAHASISWA
      </p>

      <h1 id="mahasiswa-title">
        Mahasiswa kelas SI 2A
      </h1>

      <p class="lead">
        Daftar lengkap nama dan NIM mahasiswa kelas SI 2A.
        Ketuk tombol Salin NIM untuk menyalin NIM ke clipboard.
      </p>

      <!-- Search -->
      <div class="sbox mtoolbar">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >

          <circle
            cx="11"
            cy="11"
            r="7"
          />

          <path
            d="m20 20-4-4"
          />

        </svg>

        <label
          for="mq"
          class="sr"
        >
          Cari mahasiswa berdasarkan nama atau NIM
        </label>

        <input
          type="search"
          id="mq"
          class="in search"
          placeholder="Cari nama atau NIM..."
          autocomplete="off"
        >

      </div>

      <p class="mcount" id="mcount"></p>

    </section>


    <!-- Daftar mahasiswa -->
    <ul class="mlist" id="mlist" aria-live="polite">
    </ul>

  </main>


  <!-- =========================================================
       FOOTER
       ========================================================= -->

  <footer>

    <div class="wrap fbox">

      <strong>
        Website Kelas SI 2A
      </strong>

      <span>
        Politeknik Negeri Subang.
      </span>

      <span>
        Dikelola Kelompok 6.
      </span>

    </div>

  </footer>


  <!-- =========================================================
       TOAST
       ========================================================= -->

  <div
    id="toast"
    role="status"
    aria-live="polite"
  >
  </div>


  <!-- =========================================================
       DATA + LOGIC
       ========================================================= -->

  <script>
  (function(){
    'use strict';

    var mahasiswa = [
      {nim:'10112001', nama:'Aakip Hasan Mutakin'},
      {nim:'10112004', nama:'Adam Muhammad Rizqy'},
      {nim:'10112007', nama:'Ahmad Septian Ramdani'},
      {nim:'10112010', nama:'Al Ikhsan'},
      {nim:'10112013', nama:'Alya Putri'},
      {nim:'10112016', nama:'Aulia Putri Ramadina'},
      {nim:'10112019', nama:'Cendra Kholifah Nuryadin'},
      {nim:'10112022', nama:'Dealova Frazelia Setiawan'},
      {nim:'10112025', nama:'Dian Dwi Nazira'},
      {nim:'10112031', nama:'Farid Nur Fahrudin'},
      {nim:'10112034', nama:'Gendis Wismaya Arimbi'},
      {nim:'10112037', nama:'Haikal Rizki Atallah'},
      {nim:'10112043', nama:'Meidina Fauziah Ulmi'},
      {nim:'10112049', nama:'Muhammad Nizar Zulhaqy'},
      {nim:'10112052', nama:'Nadyla Dwi Gayantry'},
      {nim:'10112055', nama:'Nazira Gilda'},
      {nim:'10112058', nama:'Nizar Misbahul Ulum'},
      {nim:'10112061', nama:'Putri Nazila Syahrani'},
      {nim:'10112064', nama:'Rafli El Shirazy'},
      {nim:'10112067', nama:'Regina Ayu Cahyanti'},
      {nim:'10112070', nama:'Riza Aditya Pirmansyah'},
      {nim:'10112073', nama:'Siti Nuraniyyah'},
      {nim:'10112076', nama:'Sukmadirjawijaya'},
      {nim:'10112079', nama:'Vina Noviyanti'},
      {nim:'10112082', nama:'Yessy Aiska'},
      {nim:'10112085', nama:'Zidan Maulana Haitami'}
    ];

    function $(s, r){ return (r || document).querySelector(s); }
    function h(tag, attrs){
      var el = document.createElement(tag);
      if (attrs) for (var k in attrs){
        var v = attrs[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), v);
        else if (v === true) el.setAttribute(k, '');
        else el.setAttribute(k, v);
      }
      for (var i = 2; i < arguments.length; i++){
        var kids = [].concat(arguments[i]);
        for (var j = 0; j < kids.length; j++){
          var c = kids[j];
          if (c == null || c === false) continue;
          el.append(c.nodeType ? c : document.createTextNode(String(c)));
        }
      }
      return el;
    }

    function initials(n){
      var p = n.trim().split(/\s+/);
      return ((p[0] || '')[0] || '?').toUpperCase() + ((p[1] || '')[0] || '').toUpperCase();
    }

    var AV = ['#FFC83D','#8BE8C2','#FFB3C1','#9CD3FF','#C9BDFF'];
    function avColor(s){
      var x = 0;
      for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) >>> 0;
      return AV[x % AV.length];
    }

    var toastTimer;
    function toast(msg){
      var t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
    }

    async function copyNim(nim, btn){
      var ok = false;
      try {
        await navigator.clipboard.writeText(nim);
        ok = true;
      } catch (e) {
        try {
          var ta = document.createElement('textarea');
          ta.value = nim;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          ok = true;
        } catch (e2) { ok = false; }
      }
      if (ok){
        toast('NIM ' + nim + ' disalin.');
        var orig = btn.textContent;
        btn.textContent = 'Tersalin \u2713';
        btn.classList.add('done');
        setTimeout(function(){ btn.textContent = orig; btn.classList.remove('done'); }, 1600);
      } else {
        toast('Gagal menyalin NIM. Salin manual: ' + nim);
      }
    }

    function render(){
      var q = ($('#mq').value || '').trim().toLowerCase();
      var list = mahasiswa
        .map(function(m, i){ return {m:m, no:i + 1}; })
        .filter(function(x){
          return !q ||
            x.m.nama.toLowerCase().indexOf(q) > -1 ||
            x.m.nim.toLowerCase().indexOf(q) > -1;
        });

      var ul = $('#mlist');
      ul.replaceChildren();

      $('#mcount').textContent = q
        ? list.length + ' dari ' + mahasiswa.length + ' mahasiswa cocok dengan pencarian'
        : mahasiswa.length + ' mahasiswa terdaftar';

      if (!list.length){
        ul.append(h('li', {class:'none'},
          h('strong', {text:'Data tidak ditemukan.'}),
          'Coba ketik nama depan atau NIM lengkap.'
        ));
        return;
      }

      list.forEach(function(x){
        var noStr = 'No. ' + String(x.no).padStart(2, '0');
        var btn = h('button', {
          class:'btn ghost copyBtn',
          type:'button',
          'aria-label':'Salin NIM ' + x.m.nama
        },
          h('svg', {viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', 'stroke-width':'2', 'aria-hidden':'true'},
            (function(){
              var r = document.createElementNS('http://www.w3.org/2000/svg','rect');
              r.setAttribute('x','9'); r.setAttribute('y','9'); r.setAttribute('width','11'); r.setAttribute('height','11'); r.setAttribute('rx','2');
              return r;
            })(),
            (function(){
              var p = document.createElementNS('http://www.w3.org/2000/svg','path');
              p.setAttribute('d','M5 15V5a2 2 0 0 1 2-2h10');
              return p;
            })()
          ),
          'Salin NIM'
        );
        btn.addEventListener('click', function(){ copyNim(x.m.nim, btn); });

        ul.append(h('li', {class:'mrow'},
          h('span', {class:'idx', 'aria-hidden':'true', text:noStr}),
          h('span', {class:'av', 'aria-hidden':'true', style:'background:' + avColor(x.m.nim)}, initials(x.m.nama)),
          h('div', {class:'rn'},
            h('strong', {text:x.m.nama}),
            h('span', {class:'nim', text:'NIM ' + x.m.nim})
          ),
          btn
        ));
      });
    }

    var qTimer;
    $('#mq').addEventListener('input', function(){
      clearTimeout(qTimer);
      qTimer = setTimeout(render, 120);
    });

    render();
  })();
  </script>

</body>
</html>
